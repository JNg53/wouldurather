<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather - Church Group Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, rgba(200, 230, 201, 0.15) 0%, rgba(255, 236, 179, 0.1) 100%);
            min-height: 100vh;
            padding: 1rem;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .join-view {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .join-view h1 {
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .join-view p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        input {
            padding: 0.75rem 1rem;
            font-size: 16px;
            border: 1px solid #C8E6C9;
            border-radius: 8px;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: #2D5A3D;
            box-shadow: 0 0 0 3px rgba(200, 230, 201, 0.2);
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        
        .divider-text {
            font-size: 12px;
            color: #999;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #C8E6C9;
            color: #2D5A3D;
        }
        
        .btn-primary:hover {
            background: #B0DAB0;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: transparent;
            color: #2D5A3D;
            border: 1px solid #C8E6C9;
        }
        
        .btn-secondary:hover {
            background: #F1F8F1;
        }
        
        .btn-secondary:active {
            transform: scale(0.98);
        }
        
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .game-view {
            padding: 2rem;
            background: linear-gradient(135deg, rgba(200, 230, 201, 0.1) 0%, rgba(255, 236, 179, 0.05) 100%);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .header-left h2 {
            font-size: 20px;
            font-weight: 500;
            color: #333;
            margin: 0 0 0.25rem;
        }
        
        .header-left p {
            font-size: 12px;
            color: #999;
            margin: 0;
        }
        
        .room-code {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #003366;
        }
        
        .vote-count {
            font-size: 13px;
            color: #666;
            background: #f5f5f5;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .question-title {
            font-size: 24px;
            font-weight: 500;
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .option {
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .option-a {
            background: #C8E6C9;
            color: #2D5A3D;
        }
        
        .option-a.selected {
            border-color: #2D5A3D;
            transform: scale(1.02);
        }
        
        .option-a.faded {
            opacity: 0.5;
        }
        
        .option-b {
            background: #FFECB3;
            color: #8B7500;
        }
        
        .option-b.selected {
            border-color: #8B7500;
            transform: scale(1.02);
        }
        
        .option-b.faded {
            opacity: 0.5;
        }
        
        .option-text {
            font-weight: 500;
            margin-bottom: 1rem;
            font-size: 16px;
        }
        
        .vote-count-large {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .voter-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        
        .voter-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .badge-a {
            background: #2D5A3D;
            color: #C8E6C9;
        }
        
        .badge-b {
            background: #8B7500;
            color: #FFECB3;
        }
        
        .check {
            font-size: 20px;
            margin-top: 0.5rem;
        }
        
        .confirmation {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #F1F8F1;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #2D5A3D;
            font-weight: 500;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .player-name {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .player-name h2 {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .player-name p {
            font-size: 13px;
            color: #999;
            margin: 0;
        }
        
        .option-button {
            text-align: left;
            padding: 1.5rem !important;
            border: 2px solid #C8E6C9;
            background: white !important;
            color: #333 !important;
            cursor: pointer !important;
            transition: all 0.2s;
        }
        
        .option-button:disabled {
            cursor: default;
        }
        
        .option-button-a.voted {
            background: #C8E6C9 !important;
            color: #2D5A3D !important;
            border-color: #2D5A3D;
        }
        
        .option-button-b {
            border-color: #FFECB3;
        }
        
        .option-button-b.voted {
            background: #FFECB3 !important;
            color: #8B7500 !important;
            border-color: #8B7500;
        }
        
        .option-button.other-voted {
            opacity: 0.5;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .game-over {
            text-align: center;
            padding: 3rem 1rem;
        }
        
        .game-over h2 {
            font-size: 28px;
            font-weight: 500;
            color: #333;
            margin-bottom: 1rem;
        }
        
        .game-over p {
            font-size: 16px;
            color: #666;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const QUESTIONS = [
            { a: "Have unlimited pizza for life", b: "Have unlimited ice cream for life" },
            { a: "Always have to wear socks", b: "Never wear socks again" },
            { a: "Travel back in time", b: "Travel forward in time" },
            { a: "Live in a big city", b: "Live in nature/countryside" },
            { a: "Be able to speak every language", b: "Be able to play any instrument" },
            { a: "Have a personal chef", b: "Have a personal trainer" },
            { a: "Visit the past for one day", b: "Visit the future for one day" },
            { a: "Always know what others think", b: "Always know what will happen next" },
            { a: "Experience summer all year", b: "Experience perfect autumn weather all year" },
            { a: "Be able to fly", b: "Be able to teleport" },
            { a: "Never have to sleep", b: "Never have to eat" },
            { a: "Have a photographic memory", b: "Have immunity to all diseases" },
            { a: "Win the lottery once", b: "Get $100 every day for life" },
            { a: "Always win at games/sports", b: "Always be lucky in life" },
            { a: "Meet your future self", b: "Meet yourself from 10 years ago" },
            { a: "Get paid for your hobby", b: "Get paid time off to do anything" },
            { a: "Have perfect eyesight forever", b: "Never need glasses/contacts" },
            { a: "Always have fresh coffee available", b: "Always have your favorite snack available" },
            { a: "Be incredibly witty", b: "Be incredibly charming" },
            { a: "Never have a bad hair day", b: "Never have a bad skin day" },
        ];

        class Game {
            constructor() {
                this.state = 'join';
                this.playerName = '';
                this.roomCode = '';
                this.isHost = false;
                this.currentRoomCode = '';
                this.currentQuestionIdx = 0;
                this.votes = {};
                this.resultsRevealed = false;
                this.userVote = null;
                this.playerInitials = '';
                this.render();
            }

            generateRoomCode() {
                return Math.random().toString(36).substring(2, 8).toUpperCase();
            }

            getInitials(name) {
                return name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);
            }

            createRoom() {
                if (!this.playerName.trim()) return;
                this.currentRoomCode = this.generateRoomCode();
                this.playerInitials = this.getInitials(this.playerName);
                this.isHost = true;
                this.state = 'host';
                localStorage.setItem(`room:${this.currentRoomCode}:votes`, JSON.stringify({}));
                this.render();
            }

            joinRoom() {
                if (!this.playerName.trim() || !this.roomCode.trim()) return;
                this.playerInitials = this.getInitials(this.playerName);
                this.currentRoomCode = this.roomCode.toUpperCase();
                const votes = localStorage.getItem(`room:${this.currentRoomCode}:votes`);
                if (votes) {
                    this.votes = JSON.parse(votes);
                }
                this.state = 'player';
                this.render();
            }

            submitVote(option) {
                this.userVote = option;
                if (!this.votes[this.currentQuestionIdx]) {
                    this.votes[this.currentQuestionIdx] = {};
                }
                if (!this.votes[this.currentQuestionIdx][option]) {
                    this.votes[this.currentQuestionIdx][option] = [];
                }
                if (!this.votes[this.currentQuestionIdx][option].includes(this.playerInitials)) {
                    this.votes[this.currentQuestionIdx][option].push(this.playerInitials);
                }
                localStorage.setItem(`room:${this.currentRoomCode}:votes`, JSON.stringify(this.votes));
                this.render();
            }

            revealResults() {
                this.resultsRevealed = true;
                this.render();
            }

            nextQuestion() {
                if (this.currentQuestionIdx < QUESTIONS.length - 1) {
                    this.currentQuestionIdx++;
                    this.resultsRevealed = false;
                    this.userVote = null;
                    this.votes = {};
                    localStorage.setItem(`room:${this.currentRoomCode}:votes`, JSON.stringify({}));
                    this.render();
                }
            }

            render() {
                const app = document.getElementById('app');
                app.innerHTML = '';

                if (this.state === 'join') {
                    app.innerHTML = `
                        <div class="join-view">
                            <h1>Would You Rather</h1>
                            <p>Fun questions. Fast votes. Live reactions.</p>
                            <div class="form-group">
                                <input type="text" id="playerName" placeholder="Enter your name" value="${this.playerName}">
                                <button class="btn-primary" onclick="game.playerName = document.getElementById('playerName').value; game.createRoom();">
                                    Create new game
                                </button>
                            </div>
                            <div class="divider">
                                <div class="divider-line"></div>
                                <div class="divider-text">Or join a game</div>
                                <div class="divider-line"></div>
                            </div>
                            <div class="form-group">
                                <input type="text" id="roomCode" placeholder="Enter room code" maxlength="6" value="${this.roomCode}" style="text-align: center; letter-spacing: 2px; font-family: monospace;">
                                <button class="btn-secondary" onclick="game.playerName = document.getElementById('playerName').value; game.roomCode = document.getElementById('roomCode').value; game.joinRoom();">
                                    Join game
                                </button>
                            </div>
                        </div>
                    `;
                } else if (this.state === 'host') {
                    const question = QUESTIONS[this.currentQuestionIdx];
                    const voteCountA = (this.votes[this.currentQuestionIdx]?.a || []).length;
                    const voteCountB = (this.votes[this.currentQuestionIdx]?.b || []).length;
                    const totalVotes = voteCountA + voteCountB;

                    app.innerHTML = `
                        <div class="game-view">
                            <div class="container">
                                <div class="header">
                                    <div class="header-left">
                                        <h2>Question ${this.currentQuestionIdx + 1} of ${QUESTIONS.length}</h2>
                                        <p>Code: <span class="room-code">${this.currentRoomCode}</span></p>
                                    </div>
                                    <div class="vote-count">${totalVotes} votes</div>
                                </div>

                                <div class="card">
                                    <div class="question-title">Would you rather...</div>
                                    <div class="options-grid">
                                        <div class="option option-a">
                                            <div class="option-text">${question.a}</div>
                                            ${this.resultsRevealed ? `
                                                <div class="vote-count-large">${voteCountA}</div>
                                                <div class="voter-badges">
                                                    ${(this.votes[this.currentQuestionIdx]?.a || []).map(initials => 
                                                        `<div class="voter-badge badge-a">${initials}</div>`
                                                    ).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                        <div class="option option-b">
                                            <div class="option-text">${question.b}</div>
                                            ${this.resultsRevealed ? `
                                                <div class="vote-count-large">${voteCountB}</div>
                                                <div class="voter-badges">
                                                    ${(this.votes[this.currentQuestionIdx]?.b || []).map(initials => 
                                                        `<div class="voter-badge badge-b">${initials}</div>`
                                                    ).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>

                                    <div class="button-group">
                                        ${!this.resultsRevealed ? `
                                            <button class="btn-primary" onclick="game.revealResults();">
                                                Reveal results
                                            </button>
                                        ` : `
                                            <button class="btn-primary ${this.currentQuestionIdx >= QUESTIONS.length - 1 ? 'btn-disabled' : ''}" 
                                                onclick="game.nextQuestion();"
                                                ${this.currentQuestionIdx >= QUESTIONS.length - 1 ? 'disabled' : ''}>
                                                ${this.currentQuestionIdx >= QUESTIONS.length - 1 ? 'Game over!' : 'Next question'}
                                            </button>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (this.state === 'player') {
                    if (this.currentQuestionIdx >= QUESTIONS.length) {
                        app.innerHTML = `
                            <div class="game-view">
                                <div class="game-over">
                                    <h2>Game Over!</h2>
                                    <p>Thanks for playing with your group!</p>
                                    <button class="btn-primary" onclick="location.reload();">Play Again</button>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    const question = QUESTIONS[this.currentQuestionIdx];
                    app.innerHTML = `
                        <div class="game-view">
                            <div class="container">
                                <div class="player-name">
                                    <h2>${this.playerName}</h2>
                                    <p>Question ${this.currentQuestionIdx + 1} of ${QUESTIONS.length}</p>
                                </div>

                                <div class="card">
                                    <div class="question-title">Would you rather...</div>
                                    <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                                        <button class="option-button option-button-a ${this.userVote === 'a' ? 'voted' : ''} ${this.userVote === 'b' ? 'other-voted' : ''}" 
                                            onclick="game.submitVote('a');" 
                                            ${this.userVote !== null ? 'disabled' : ''}>
                                            <div>${question.a}</div>
                                            ${this.userVote === 'a' ? '<div class="check">✓</div>' : ''}
                                        </button>

                                        <button class="option-button option-button-b ${this.userVote === 'b' ? 'voted' : ''} ${this.userVote === 'a' ? 'other-voted' : ''}" 
                                            onclick="game.submitVote('b');" 
                                            ${this.userVote !== null ? 'disabled' : ''}>
                                            <div>${question.b}</div>
                                            ${this.userVote === 'b' ? '<div class="check">✓</div>' : ''}
                                        </button>
                                    </div>

                                    ${this.userVote ? `
                                        <div class="confirmation">
                                            ✓ Vote sent! Waiting for host...
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        const game = new Game();
    </script>
</body>
</html>
